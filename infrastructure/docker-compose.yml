version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: urbangar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: urbangar
      POSTGRES_PASSWORD: urbangar_dev
      POSTGRES_DB: urbangar
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U urbangar']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urbangar-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass urbangar_dev
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', 'urbangar_dev', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: urbangar-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: urbangar_meili_dev
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
